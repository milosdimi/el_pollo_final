<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/icons/chicken.png">

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/statusbar-boss.class.js"></script>
    <script src="models/statusbar-healt.class.js"></script>
    <script src="models/statusbar-coin.class.js"></script>
    <script src="models/statusbar-bottle.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
</head>

<body onload="setupMenu()">
    <h1 id="title">El Pollo Loco</h1>
    <section class="stage" id="stage">
        <!-- Canvas -->
        <canvas id="canvas" width="720" height="480" tabindex="0" aria-label="Spielfeld"></canvas>
        <!-- Toolbar -->
        <div class="toolbar">
            <button id="btnPause" class="btns" aria-label="Pause/Resume" title="Pause/Resume (P / ESC)">
                ⏯
            </button>
            <button id="btnFS" class="btns" aria-label="Fullscreen umschalten" title="Fullscreen (F)">
                ⛶
            </button>
            <button id="btnReload" class="btns" aria-label="Neu starten" title="Neu laden (R)">
                ↻
            </button>
        </div>
        <!-- Start-Overlay -->
        <div id="menuOverlay" class="overlay">
            <img id="menuImg" alt="Start Screen" src="img/9_intro_outro_screens/start/startscreen_2.png">
            <button id="btnPlay" class="btn primary" aria-label="Play">▶ Play</button>
        </div>
        <!-- End-Overlay (Win/Lose) -->
        <div id="endOverlay" class="overlay hidden">
            <img id="endImg" alt="Game Result">
            <div class="overlay-actions">
                <button id="btnBack" class="btn" aria-label="Back to start">↩ Back</button>
                <button id="btnRestart" class="btn" aria-label="Restart">⟲ Restart</button>
            </div>
        </div>
    </section>
</body>

</html>
